status:
  scope: >-
    Formalized: the results listed under alignment. Not formalized: the exact formula
    M(p,H) = (2 pi^2/p) sum_{h in H} s(h,p) (Proposition 5.1), so the mean square M(p,H) does not appear
    in the statements; the pointwise approximation through Burgess' bound (Proposition 5.15, Theorem 5.16);
    Corollary 5.18 and the remarks after Theorem 5.14.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude.ai with code execution"
      tool_setup: >-
        AI-assisted: the Lean code was drafted and repaired by Claude against the manuscript's
        statements and proofs, compiled locally with lake, and the export of Solution was checked with
        the Lean kernel, nanoda and con-ron.
      cost:
        wall_time: "about one day"
        spend_usd: "subscription-based"
        hardware: "API-only plus local machine"
      prompting_notes: "The model was given the manuscript's statements and proofs and asked to formalize them without sorry or native_decide."
  spend_usd: "subscription-based"
  notes: >-
    The author chose the result. The scope (the Dedekind-sum form, with Proposition 5.1 quoted) and the
    lattice proof of Legendre's pairing were chosen during formalization to keep the development elementary.

fidelity:
  divergences: >-
    The mean square M(p,H) is not defined; Theorem 5.14 is formalized as the bound on
    12 sum_{h in H} s(h,p) - p S_H(p), which with Proposition 5.1 is the manuscript's statement. The
    implied constants are explicit: |E| <= 4n in Lemma 5.12, 6n per residue and n <= 2 log_2 p + 1 (the
    manuscript has 2 log_2 p + 2). H is any finite set of residues modulo p (S_H(p) is defined for it by
    the manuscript's formula), not only a subgroup of odd order. The convergent denominators are
    shifted: den k h j = q_{j-1}. Lemma 5.12, the Euclid identities and Lemma 5.13 are proved for every
    modulus k and 0 < h < k coprime; the coprimality of the pairs (r_j, q_{j-1}) and the small-ratio
    formula need k prime. Lemma 5.13 is proved by a lattice argument (consecutive vectors
    (r_j, (-1)^{j+1} q_{j-1}) form a basis of {x = hy mod k}) instead of Legendre's theorem on
    convergents; uniqueness of j follows from the strict decrease of r_j.

review:
  status: "self-assessed"
  reviewers:
    - "Joseph S. Farland"
  notes: >-
    The definitions in Challenge.lean are copied verbatim from the development and compared by
    Comparator. The statements and the companion paper were checked by an independent AI review, and
    check/statements.py recomputes every statement numerically. No external referee has reviewed the
    manuscript or the formalization.

alignment:
  namespace: "SmallRatio"
  statements:
    - source: "Dedekind reciprocity (used in the proof of Lemma 5.12)"
      lean: "SmallRatio.reciprocity"
      module: "Challenge"
      status: "proved"
    - source: "Euclid's algorithm terminates at r_n = 1 with r strictly decreasing"
      lean: "SmallRatio.euclid_terminates"
      module: "Challenge"
      status: "proved"
    - source: "The identity r_{j-1} q_{j-1} + r_j q_{j-2} = p before Lemma 5.12"
      lean: "SmallRatio.euclid_identity"
      module: "Challenge"
      status: "proved"
    - source: "The congruence h q_{j-1} = (-1)^{j+1} r_j mod p before Lemma 5.12"
      lean: "SmallRatio.euclid_congruence"
      module: "Challenge"
      status: "proved"
    - source: "The bound on n before Lemma 5.12"
      lean: "SmallRatio.euclid_length"
      module: "Challenge"
      status: "proved"
    - source: "Lemma 5.12 (Dedekind sums along Euclid's algorithm)"
      lean: "SmallRatio.along_euclid"
      module: "Challenge"
      status: "proved"
    - source: "Lemma 5.13 (Legendre)"
      lean: "SmallRatio.pairing"
      module: "Challenge"
      status: "proved"
    - source: "gcd(r_j, q_{j-1}) = 1 before Lemma 5.12"
      lean: "SmallRatio.pairs_coprime"
      module: "Challenge"
      status: "proved"
    - source: "Proof of Theorem 5.14, one residue, with the number of steps"
      lean: "SmallRatio.small_ratio"
      module: "Challenge"
      status: "proved"
    - source: "Proof of Theorem 5.14, one residue"
      lean: "SmallRatio.small_ratio_log"
      module: "Challenge"
      status: "proved"
    - source: "Definition of S_H(p): sum over H of the per-residue sums"
      lean: "SmallRatio.sum_over_set"
      module: "Challenge"
      status: "proved"
    - source: "Theorem 5.14 (Dedekind-sum form: 12 sum_{h in H} s(h,p) = p S_H(p) + O(|H| log p))"
      lean: "SmallRatio.small_ratio_subgroup"
      module: "Challenge"
      status: "proved"

acknowledgements: "Lean 4 and Mathlib; Claude (Anthropic) for formalization assistance; the Palomar starter template for the check scripts."
