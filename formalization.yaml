# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "SmallRatio: Dedekind sums along Euclid's algorithm and the small-ratio formula"
  description: >-
    For a prime p and 0 < h < p, the Dedekind sum s(h,p) is determined, up to an explicit error of
    order log p, by the fractions of small height congruent to plus or minus h: with the sum over
    the coprime pairs u, v >= 1 with uv < p/2, |12 s(h,p) - p sum ([hv = u mod p] - [hv = -u mod p])/(uv)|
    <= 6n <= 12 log_2 p + 6, where n is the length of Euclid's algorithm on (p, h). Summed over any set
    H of residues, in particular over a subgroup of odd order, this gives
    |12 sum_{h in H} s(h,p) - p S_H(p)| <= |H| (12 log_2 p + 6), where S_H(p) is the signed sum of 1/(uv)
    over the coprime pairs with uv < p/2 and u/v in H or -H. The development proves Dedekind
    reciprocity from scratch (by counting lattice points), the identities of Euclid's algorithm and
    the bound n <= 2 log_2 k + 1, the alternating-sum form 12 s(h,k) = sum (-1)^{j+1} k/(r_j q_{j-1}) + E
    with |E| <= 4n, and Legendre's pairing of the small coprime pairs with the steps of the algorithm,
    by a lattice-basis argument instead of continued fractions.
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11F20", "11A55", "11M20", "68V20"]

sources:
  - title: "The small-ratio formula for Dedekind sums, formalized in Lean"
    authors:
      - "Joseph S. Farland"
    type: "article"
    location: "Preprint, Zenodo, 2026, https://doi.org/10.5281/zenodo.23801363 (v1.0); all versions https://doi.org/10.5281/zenodo.23801362"
    relationship: "formalizes"
    note: >-
      The companion paper of this formalization, by the same author. It restates the formalized
      results with proofs that follow the formal ones, and gives the correspondence between the
      manuscript, the paper and the Lean names.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Mean squares of Dirichlet L-functions at s=1 over characters of fixed order and over subgroups"
    authors:
      - "Joseph S. Farland"
    type: "article"
    location: "Unpublished manuscript, 2026"
    relationship: "formalizes"
    note: >-
      Same author. Formalized: the identities of Euclid's algorithm before Lemma 5.12, Lemma 5.12,
      Lemma 5.13 and Theorem 5.14 in its Dedekind-sum form, 12 sum_{h in H} s(h,p) = p S_H(p) + O(|H| log p).
      Not formalized: Proposition 5.1 (the exact formula M(p,H) = (2 pi^2/p) sum_{h in H} s(h,p), due to
      Walum and to Louboutin and Munsch), which turns the Dedekind-sum form into the stated form
      M(p,H) = (pi^2/6) S_H(p) + O(log p/m); Proposition 5.15 and Theorem 5.16 (Burgess' bound); the
      rest of the manuscript. On novelty: Lemma 5.12 is a reformulation of the Barkan-Hickerson-Knuth
      formula, obtained, as by Hall and Huxley, by iterating reciprocity; Lemma 5.13 is Legendre's
      theorem on convergents; the per-pair approximation s(h,k) ~ k/(12uv) is known (Conrey,
      Fransen, Klein and Scott, Lemma 2; Girstmair 2003, Theorem 3(b)). The summed form with the exact
      cut uv < p/2, the explicit error and the subgroup sum S_H(p) were not found in these sources or in
      Munsch and Shparlinski (Forum Math. 38 (2026)), whose identity (5.3) in its second-moment case (their k = 1, k indexing the moment) is a smoothed version.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Dedekind Sums"
    authors:
      - "H. Rademacher"
      - "E. Grosswald"
    type: "book"
    location: "Carus Mathematical Monographs 16, Mathematical Association of America, 1972"
    relationship: "background"
    note: "Dedekind reciprocity and its lattice-point proof."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Dedekind sums and continued fractions"
    authors:
      - "R. R. Hall"
      - "M. N. Huxley"
    type: "article"
    location: "Acta Arith. 63 (1993), 79-90"
    relationship: "background"
    note: "Iterating reciprocity along the convergents; Barkan's evaluation of s(h,k) by partial quotients."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Zones of large and small values for Dedekind sums"
    authors:
      - "K. Girstmair"
    type: "article"
    location: "Acta Arith. 109 (2003), 299-308"
    relationship: "background"
    note: "The approximation 12 s(m,N) ~ N/(d q) near a fraction of small height."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Moments and non-vanishing of L-functions over subgroups of optimal index"
    authors:
      - "M. Munsch"
      - "I. E. Shparlinski"
    type: "article"
    location: "Forum Math. 38 (2026), 1469-1490; arXiv:2309.10207"
    relationship: "background"
    note: "Identity (5.3), a smoothed sum over r = +-lambda s mod p, of which the small-ratio formula is an unsmoothed explicit form for k = 1."
    license: "unknown"
    author_endorsement: "n/a"

